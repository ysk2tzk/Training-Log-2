<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c6b58" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-training.png" />
    <link rel="apple-touch-icon" href="/icon-training.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <title>記録修正</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --card: #fffdf8;
        --ink: #1f2a2e;
        --accent: #0c6b58;
        --line: #d9d3c6;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background:
          radial-gradient(circle at 10% 10%, #fff5d9 0%, transparent 45%),
          radial-gradient(circle at 90% 0%, #d8efe9 0%, transparent 35%),
          var(--bg);
        color: var(--ink);
      }

      .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px 14px 28px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }

      h1 {
        margin: 0;
        font-size: 27px;
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
        font-weight: 900;
        letter-spacing: 0.01em;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 12px;
      }

      .menu-wrap { position: relative; }

      .menu-btn {
        width: 44px;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        font-size: 22px;
        line-height: 1;
        padding: 0;
      }

      .menu-panel {
        position: absolute;
        right: 0;
        top: 50px;
        min-width: 168px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        padding: 6px;
      }

      .menu-item {
        display: block;
        width: 100%;
        text-align: left;
        background: #fff;
        color: var(--ink);
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
        white-space: nowrap;
      }

      .menu-item:hover { background: #f6f3eb; }
      .hidden { display: none; }

      .field { margin-bottom: 10px; }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 14px;
      }

      input, select, textarea, button {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 10px 12px;
        font-size: 16px;
        background: white;
      }

      input[type="number"] {
        text-align: right;
      }

      input[readonly] {
        background: #f6f3eb;
        color: #606b6f;
      }

      textarea {
        resize: vertical;
        min-height: 88px;
      }

      button {
        border: none;
        background: linear-gradient(90deg, var(--accent), #109a7e);
        color: white;
        font-weight: 700;
      }

      button.secondary {
        background: #ebe5d9;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .meta {
        margin-bottom: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fcfbf7;
      }

      .meta-line {
        font-size: 14px;
        line-height: 1.8;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .status {
        color: var(--accent);
        font-size: 13px;
        min-height: 1.2em;
        margin: 8px 0 0;
      }

      .err {
        color: #c23131;
        font-size: 13px;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="header">
          <h1>記録修正</h1>
          <div class="menu-wrap">
            <button id="menuBtn" class="menu-btn" type="button" aria-label="メニュー">☰</button>
            <div id="menuPanel" class="menu-panel hidden">
              <button id="mainPageBtn" class="menu-item" type="button">トレーニング記録</button>
              <button id="historyBtn" class="menu-item" type="button">過去ログ一覧</button>
              <button id="gearPageBtn" class="menu-item" type="button">ギア管理</button>
              <button id="coefficientsBtn" class="menu-item" type="button">係数</button>
              <button id="suuntoBtn" class="menu-item" type="button">Suunto連携</button>
            </div>
          </div>
        </div>

        <div class="meta">
          <div class="meta-line"><strong>ID:</strong> <span id="metaId">-</span></div>
          <div class="meta-line"><strong>カテゴリ:</strong> <span id="metaCategory">-</span></div>
          <div class="meta-line"><strong>source_activity_id:</strong> <span id="metaSourceActivityId">-</span></div>
        </div>

        <div class="field">
          <label for="createdAt">日時</label>
          <input id="createdAt" type="datetime-local" step="1" />
        </div>

        <div class="field">
          <label for="category">カテゴリ</label>
          <input id="category" type="text" readonly />
        </div>

        <div class="field">
          <label for="item">アイテム</label>
          <select id="item">
            <option value="" selected>選択してください</option>
          </select>
        </div>

        <div id="customItemField" class="field hidden">
          <label for="customItem">自由入力</label>
          <input id="customItem" type="text" placeholder="アイテム名" />
        </div>

        <div id="dynamicFields"></div>

        <div class="button-row">
          <button id="backBtn" class="secondary" type="button">戻る</button>
          <button id="saveBtn" type="button">保存</button>
        </div>
        <p id="status" class="status"></p>
        <p id="error" class="err"></p>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const logId = Number(params.get("id"));
      const OTHER = "その他(自由入力)";
      const DEFAULT_TRAINING_FIELDS = {
        showWeight: true,
        repsLabel: "Reps",
        repsPlaceholder: "回",
        showGear: false,
        showRemarks: true
      };
      const ITEM_FIELD_CONFIGS = {
        ラン: {
          showWeight: false,
          repsLabel: "距離 (km)",
          repsPlaceholder: "0.0km",
          showGear: true,
          showRemarks: true
        },
        バイク: {
          showWeight: false,
          repsLabel: "継続時間",
          repsPlaceholder: "min",
          showGear: true,
          showRemarks: true
        },
        トレッドミル: {
          showWeight: false,
          repsLabel: "距離",
          repsPlaceholder: "0.0km",
          showGear: true,
          showRemarks: true
        }
      };
      const REWARD_FIELD_CONFIG = {
        repsLabel: "価格",
        repsPlaceholder: "円",
        showRemarks: true
      };

      const menuBtn = document.getElementById("menuBtn");
      const menuPanel = document.getElementById("menuPanel");
      const mainPageBtn = document.getElementById("mainPageBtn");
      const historyBtn = document.getElementById("historyBtn");
      const gearPageBtn = document.getElementById("gearPageBtn");
      const coefficientsBtn = document.getElementById("coefficientsBtn");
      const suuntoBtn = document.getElementById("suuntoBtn");
      const metaIdEl = document.getElementById("metaId");
      const metaCategoryEl = document.getElementById("metaCategory");
      const metaSourceActivityIdEl = document.getElementById("metaSourceActivityId");
      const createdAtEl = document.getElementById("createdAt");
      const categoryEl = document.getElementById("category");
      const itemEl = document.getElementById("item");
      const customItemFieldEl = document.getElementById("customItemField");
      const customItemEl = document.getElementById("customItem");
      const dynamicFieldsEl = document.getElementById("dynamicFields");
      const backBtn = document.getElementById("backBtn");
      const saveBtn = document.getElementById("saveBtn");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");

      let options = { trainingItems: [], rewardItems: [], gears: [] };
      let currentLog = null;

      function formatTokyoDateInputValue(dateLike) {
        const date = new Date(dateLike);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(date);
      }

      function formatTokyoDateTimeLocal(dateLike) {
        const date = new Date(dateLike);
        if (Number.isNaN(date.getTime())) return "";

        const parts = Object.fromEntries(
          new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Tokyo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }).formatToParts(date)
            .filter((part) => part.type !== "literal")
            .map((part) => [part.type, part.value])
        );

        return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}`;
      }

      function toTokyoOffsetString(localValue) {
        return localValue ? `${localValue}+09:00` : "";
      }

      function fieldHtml(id, label, type, placeholder = "", step = "") {
        return `
          <div class="field">
            <label for="${id}">${label}</label>
            <input id="${id}" type="${type}" placeholder="${placeholder}" ${type === "number" ? 'inputmode="decimal"' : ""} ${step ? `step="${step}"` : ""} />
          </div>
        `;
      }

      function selectHtml(id, label, values) {
        return `
          <div class="field">
            <label for="${id}">${label}</label>
            <select id="${id}">
              <option value="">選択してください</option>
              ${values.map((v) => `<option value="${v}">${v}</option>`).join("")}
            </select>
          </div>
        `;
      }

      function textareaHtml(id, label, placeholder) {
        return `
          <div class="field">
            <label for="${id}">${label}</label>
            <textarea id="${id}" placeholder="${placeholder}"></textarea>
          </div>
        `;
      }

      function getGearOptionsForItem(item) {
        const allGears = (options.gears || []).map((g) => ({
          name: typeof g === "string" ? g : g.name,
          category: typeof g === "string" ? "" : g.category
        }));

        if (item === "ラン") {
          return allGears.filter((g) => g.category === "Shoes").map((g) => g.name).filter(Boolean);
        }

        if (item === "バイク") {
          return allGears.filter((g) => g.category === "Bike").map((g) => g.name).filter(Boolean);
        }

        return allGears.map((g) => g.name).filter(Boolean);
      }

      function getTrainingFieldConfig(item) {
        return {
          ...DEFAULT_TRAINING_FIELDS,
          ...(ITEM_FIELD_CONFIGS[item] || {})
        };
      }

      function renderItemOptions() {
        const category = categoryEl.value;
        const items = category === "Training" ? options.trainingItems : options.rewardItems;
        const all = [...new Set(items)].sort((a, b) => a.localeCompare(b, "ja"));
        all.push(OTHER);
        itemEl.innerHTML =
          `<option value="" selected>選択してください</option>` +
          all.map((value) => `<option value="${value}">${value}</option>`).join("");
      }

      function applyCurrentFieldValues() {
        if (!currentLog) return;

        const weightInput = document.getElementById("weight");
        const repsInput = document.getElementById("reps");
        const gearInput = document.getElementById("gear");
        const remarksInput = document.getElementById("remarks");

        if (weightInput) weightInput.value = currentLog.weight ?? "";
        if (repsInput) repsInput.value = currentLog.reps ?? "";
        if (gearInput) gearInput.value = currentLog.gear || "";
        if (remarksInput) remarksInput.value = currentLog.remarks || "";
      }

      function captureCurrentFieldValues() {
        if (!currentLog) return;

        const weightInput = document.getElementById("weight");
        const repsInput = document.getElementById("reps");
        const gearInput = document.getElementById("gear");
        const remarksInput = document.getElementById("remarks");

        if (weightInput) currentLog.weight = weightInput.value;
        if (repsInput) currentLog.reps = repsInput.value;
        if (gearInput) currentLog.gear = gearInput.value;
        if (remarksInput) currentLog.remarks = remarksInput.value;
        currentLog.item = itemEl.value === OTHER ? customItemEl.value : itemEl.value;
      }

      function renderDynamicFields() {
        const category = categoryEl.value;
        const item = itemEl.value;
        const isOther = item === OTHER || item.startsWith("その他");
        customItemFieldEl.classList.toggle("hidden", !isOther);

        if (!category || !item) {
          dynamicFieldsEl.innerHTML = "";
          return;
        }

        if (category === "Training") {
          const config = isOther ? DEFAULT_TRAINING_FIELDS : getTrainingFieldConfig(item);
          const fields = [];

          if (config.showWeight) {
            fields.push(fieldHtml("weight", "Weight", "number", "0.0kg", "any"));
          }

          fields.push(fieldHtml("reps", config.repsLabel, "number", config.repsPlaceholder, "any"));

          if (config.showGear) {
            fields.push(selectHtml("gear", "Gear", getGearOptionsForItem(item)));
          }

          if (config.showRemarks) {
            fields.push(textareaHtml("remarks", "備考", "メモ"));
          }

          dynamicFieldsEl.innerHTML = fields.join("");
          applyCurrentFieldValues();
          return;
        }

        if (category === "Reward") {
          dynamicFieldsEl.innerHTML =
            fieldHtml("reps", REWARD_FIELD_CONFIG.repsLabel, "number", REWARD_FIELD_CONFIG.repsPlaceholder, "any") +
            textareaHtml("remarks", "備考", "メモ");
          applyCurrentFieldValues();
        }
      }

      async function loadOptions() {
        const res = await fetch("/api/options");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || "オプション取得に失敗しました");
        }

        options = {
          trainingItems: Array.isArray(data.trainingItems) ? data.trainingItems : [],
          rewardItems: Array.isArray(data.rewardItems) ? data.rewardItems : [],
          gears: Array.isArray(data.gears) ? data.gears : []
        };
      }

      async function loadLog() {
        if (!Number.isInteger(logId) || logId <= 0) {
          throw new Error("無効なIDです");
        }

        const res = await fetch(`/api/logs/${logId}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || "記録の取得に失敗しました");
        }

        currentLog = data.log || null;
        if (!currentLog) {
          throw new Error("記録が見つかりません");
        }

        metaIdEl.textContent = currentLog.id || "-";
        metaCategoryEl.textContent = currentLog.category || "-";
        metaSourceActivityIdEl.textContent = currentLog.source_activity_id || "-";
        createdAtEl.value = formatTokyoDateTimeLocal(currentLog.created_at || "");
        categoryEl.value = currentLog.category || "";

        renderItemOptions();

        const categoryItems = currentLog.category === "Training" ? options.trainingItems : options.rewardItems;
        const hasKnownItem = categoryItems.includes(currentLog.item);
        itemEl.value = hasKnownItem ? currentLog.item : OTHER;
        customItemEl.value = hasKnownItem ? "" : (currentLog.item || "");
        renderDynamicFields();
      }

      async function saveLog() {
        errorEl.textContent = "";
        statusEl.textContent = "保存中...";
        saveBtn.disabled = true;

        const body = {
          date: formatTokyoDateInputValue(createdAtEl.value || ""),
          created_at: toTokyoOffsetString(createdAtEl.value),
          item: itemEl.value,
          customItem: customItemEl.value,
          weight: document.getElementById("weight")?.value ?? "",
          reps: document.getElementById("reps")?.value ?? "",
          gear: document.getElementById("gear")?.value ?? "",
          remarks: document.getElementById("remarks")?.value ?? ""
        };

        try {
          const res = await fetch(`/api/logs/${logId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || "保存に失敗しました");
          }
          window.location.href = "/";
        } catch (error) {
          statusEl.textContent = "";
          errorEl.textContent = error?.message || "保存に失敗しました";
        } finally {
          saveBtn.disabled = false;
        }
      }

      menuBtn.addEventListener("click", () => {
        menuPanel.classList.toggle("hidden");
      });
      mainPageBtn.addEventListener("click", () => {
        menuPanel.classList.add("hidden");
        window.location.href = "/";
      });
      historyBtn.addEventListener("click", () => {
        menuPanel.classList.add("hidden");
        window.location.href = "/history.html";
      });
      gearPageBtn.addEventListener("click", () => {
        menuPanel.classList.add("hidden");
        window.location.href = "/gear.html";
      });
      coefficientsBtn.addEventListener("click", () => {
        menuPanel.classList.add("hidden");
        window.location.href = "/coefficients.html";
      });
      suuntoBtn.addEventListener("click", () => {
        menuPanel.classList.add("hidden");
        window.location.href = "/suunto.html";
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu-wrap")) {
          menuPanel.classList.add("hidden");
        }
      });
      itemEl.addEventListener("change", () => {
        captureCurrentFieldValues();
        renderDynamicFields();
      });
      customItemEl.addEventListener("input", () => {
        if (!currentLog) return;
        currentLog.item = customItemEl.value;
      });
      backBtn.addEventListener("click", () => {
        window.location.href = "/";
      });
      saveBtn.addEventListener("click", saveLog);

      loadOptions()
        .then(() => loadLog())
        .catch((error) => {
          errorEl.textContent = error?.message || "初期化に失敗しました";
        });
    </script>
  </body>
</html>
