<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c6b58" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-training.png" />
    <link rel="apple-touch-icon" href="/icon-training.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <title>記録修正</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --card: #fffdf8;
        --ink: #1f2a2e;
        --accent: #0c6b58;
        --line: #d9d3c6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background:
          radial-gradient(circle at 10% 10%, #fff5d9 0%, transparent 45%),
          radial-gradient(circle at 90% 0%, #d8efe9 0%, transparent 35%),
          var(--bg);
        color: var(--ink);
      }
      .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px 14px 28px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 12px;
      }
      h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 900;
      }
      .menu-wrap { position: relative; }
      .menu-btn {
        width: 44px;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        font-size: 22px;
        line-height: 1;
        padding: 0;
      }
      .menu-panel {
        position: absolute;
        right: 0;
        top: 50px;
        min-width: 168px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        padding: 6px;
      }
      .menu-item {
        display: block;
        width: 100%;
        text-align: left;
        background: #fff;
        color: var(--ink);
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
        white-space: nowrap;
      }
      .menu-item:hover { background: #f6f3eb; }
      .hidden { display: none; }
      .field { margin-bottom: 10px; }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 14px;
      }
      input, textarea, button {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 10px 12px;
        font-size: 16px;
        background: white;
      }
      textarea {
        resize: vertical;
        min-height: 88px;
      }
      input[readonly] {
        background: #f6f3eb;
        color: #606b6f;
      }
      button {
        border: none;
        background: linear-gradient(90deg, var(--accent), #109a7e);
        color: white;
        font-weight: 700;
      }
      button.secondary {
        background: #ebe5d9;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .meta {
        margin-bottom: 14px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fcfbf7;
      }
      .meta-line {
        font-size: 14px;
        line-height: 1.7;
      }
      .status {
        color: var(--accent);
        font-size: 13px;
        min-height: 1.2em;
        margin: 10px 0 0;
      }
      .err {
        color: #c23131;
        font-size: 13px;
        min-height: 1.2em;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="header">
          <h1>記録修正</h1>
          <div class="menu-wrap">
            <button id="menuBtn" class="menu-btn" type="button" aria-label="メニュー">☰</button>
            <div id="menuPanel" class="menu-panel hidden">
              <button id="mainPageBtn" class="menu-item" type="button">トレーニング記録</button>
              <button id="historyBtn" class="menu-item" type="button">過去ログ一覧</button>
              <button id="gearPageBtn" class="menu-item" type="button">ギア管理</button>
              <button id="coefficientsBtn" class="menu-item" type="button">係数</button>
              <button id="suuntoBtn" class="menu-item" type="button">Suunto連携</button>
            </div>
          </div>
        </div>

        <div class="meta">
          <div class="meta-line"><strong>ID:</strong> <span id="metaId">-</span></div>
          <div class="meta-line"><strong>カテゴリ:</strong> <span id="metaCategory">-</span></div>
          <div class="meta-line"><strong>source_activity_id:</strong> <span id="metaSourceActivityId">-</span></div>
        </div>

        <div class="field">
          <label for="item">アイテム</label>
          <input id="item" type="text" />
        </div>
        <div class="field">
          <label for="weight">Weight</label>
          <input id="weight" type="number" step="any" />
        </div>
        <div class="field">
          <label for="reps">Reps</label>
          <input id="reps" type="number" step="any" />
        </div>
        <div class="field">
          <label for="gear">Gear</label>
          <input id="gear" type="text" />
        </div>
        <div class="field">
          <label for="remarks">備考</label>
          <textarea id="remarks"></textarea>
        </div>
        <div class="field">
          <label for="score">Score</label>
          <input id="score" type="number" step="any" />
        </div>
        <div class="field">
          <label for="createdAt">created_at (JST)</label>
          <input id="createdAt" type="datetime-local" step="1" />
        </div>
        <div class="field">
          <label for="source">source</label>
          <input id="source" type="text" />
        </div>
        <div class="field">
          <label for="durationSeconds">duration_seconds</label>
          <input id="durationSeconds" type="number" step="1" />
        </div>

        <div class="button-row">
          <button id="backBtn" class="secondary" type="button">戻る</button>
          <button id="saveBtn" type="button">保存</button>
        </div>
        <p id="status" class="status"></p>
        <p id="error" class="err"></p>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const logId = Number(params.get("id"));

      const menuBtn = document.getElementById("menuBtn");
      const menuPanel = document.getElementById("menuPanel");
      const mainPageBtn = document.getElementById("mainPageBtn");
      const historyBtn = document.getElementById("historyBtn");
      const gearPageBtn = document.getElementById("gearPageBtn");
      const coefficientsBtn = document.getElementById("coefficientsBtn");
      const suuntoBtn = document.getElementById("suuntoBtn");
      const metaIdEl = document.getElementById("metaId");
      const metaCategoryEl = document.getElementById("metaCategory");
      const metaSourceActivityIdEl = document.getElementById("metaSourceActivityId");
      const itemEl = document.getElementById("item");
      const weightEl = document.getElementById("weight");
      const repsEl = document.getElementById("reps");
      const gearEl = document.getElementById("gear");
      const remarksEl = document.getElementById("remarks");
      const scoreEl = document.getElementById("score");
      const createdAtEl = document.getElementById("createdAt");
      const sourceEl = document.getElementById("source");
      const durationSecondsEl = document.getElementById("durationSeconds");
      const backBtn = document.getElementById("backBtn");
      const saveBtn = document.getElementById("saveBtn");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");

      function formatTokyoDateTimeLocal(dateLike) {
        const date = new Date(dateLike);
        if (Number.isNaN(date.getTime())) return "";

        const parts = Object.fromEntries(
          new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Tokyo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }).formatToParts(date)
            .filter((part) => part.type !== "literal")
            .map((part) => [part.type, part.value])
        );

        return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}`;
      }

      function toTokyoOffsetString(localValue) {
        return localValue ? `${localValue}+09:00` : "";
      }

      async function loadLog() {
        if (!Number.isInteger(logId) || logId <= 0) {
          throw new Error("無効なIDです");
        }

        const res = await fetch(`/api/logs/${logId}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || "記録の取得に失敗しました");
        }

        const log = data.log || {};
        metaIdEl.textContent = log.id || "-";
        metaCategoryEl.textContent = log.category || "-";
        metaSourceActivityIdEl.textContent = log.source_activity_id || "-";
        itemEl.value = log.item || "";
        weightEl.value = log.weight ?? "";
        repsEl.value = log.reps ?? "";
        gearEl.value = log.gear || "";
        remarksEl.value = log.remarks || "";
        scoreEl.value = log.score ?? "";
        createdAtEl.value = formatTokyoDateTimeLocal(log.created_at || "");
        sourceEl.value = log.source || "";
        durationSecondsEl.value = log.duration_seconds ?? "";
      }

      async function saveLog() {
        errorEl.textContent = "";
        statusEl.textContent = "保存中...";
        saveBtn.disabled = true;

        const body = {
          item: itemEl.value,
          weight: weightEl.value,
          reps: repsEl.value,
          gear: gearEl.value,
          remarks: remarksEl.value,
          score: scoreEl.value,
          created_at: toTokyoOffsetString(createdAtEl.value),
          source: sourceEl.value,
          duration_seconds: durationSecondsEl.value
        };

        try {
          const res = await fetch(`/api/logs/${logId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || "保存に失敗しました");
          }
          statusEl.textContent = "保存しました";
        } catch (error) {
          statusEl.textContent = "";
          errorEl.textContent = error?.message || "保存に失敗しました";
        } finally {
          saveBtn.disabled = false;
        }
      }

      menuBtn.addEventListener("click", () => {
        menuPanel.classList.toggle("hidden");
      });
      mainPageBtn.addEventListener("click", () => {
        window.location.href = "/";
      });
      historyBtn.addEventListener("click", () => {
        window.location.href = "/history.html";
      });
      gearPageBtn.addEventListener("click", () => {
        window.location.href = "/gear.html";
      });
      coefficientsBtn.addEventListener("click", () => {
        window.location.href = "/coefficients.html";
      });
      suuntoBtn.addEventListener("click", () => {
        window.location.href = "/suunto.html";
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu-wrap")) {
          menuPanel.classList.add("hidden");
        }
      });
      backBtn.addEventListener("click", () => {
        window.location.href = "/";
      });
      saveBtn.addEventListener("click", saveLog);

      loadLog().catch((error) => {
        errorEl.textContent = error?.message || "初期化に失敗しました";
      });
    </script>
  </body>
</html>
